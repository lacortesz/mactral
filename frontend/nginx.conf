server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: cualquier ruta que no sea un archivo existente cae a index.html
        # para que React Router maneje el enrutamiento del lado del cliente.
        try_files $uri $uri/ /index.html;
    }
}

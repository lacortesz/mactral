services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mactral
      POSTGRES_PASSWORD: mactral
      POSTGRES_DB: mactral
    ports:
      - "5432:5432"
    volumes:
      - mactral_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mactral -d mactral"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql+psycopg://mactral:mactral@postgres:5432/mactral
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambia-esto-en-produccion}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql+psycopg://mactral:mactral@postgres:5432/mactral
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-maya@grupomactral.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Mactral2026!}
    # alembic upgrade head es idempotente: se repite aquí porque el arranque
    # de "auth" es asíncrono y no hay garantía de que ya haya migrado.
    command: ["sh", "-c", "alembic upgrade head && python seed.py"]
    depends_on:
      postgres:
        condition: service_healthy

  projects:
    build: ./services/projects
    environment:
      DATABASE_URL: postgresql+psycopg://mactral:mactral@postgres:5432/mactral
      # Mismo secreto que "auth": este servicio solo verifica el JWT emitido
      # por auth, no emite sesiones propias.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambia-esto-en-produccion}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy

  seed-projects:
    build: ./services/projects
    environment:
      DATABASE_URL: postgresql+psycopg://mactral:mactral@postgres:5432/mactral
    command: ["sh", "-c", "alembic upgrade head && python seed.py"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_PROJECTS_API_BASE_URL: ${VITE_PROJECTS_API_BASE_URL:-http://localhost:8100}
    ports:
      - "8080:80"
    depends_on:
      - auth
      - projects

volumes:
  mactral_pgdata:
